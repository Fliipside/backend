[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipside-ai-backend"
version = "0.1.0"
description = "Flipside FastAPI server"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anyio>=3.6.2,<5",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "python-dotenv>=1,<2",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "pgvector>=0.3,<1",
    "redis>=5,<8",
    "httpx>=0.27,<1",
    "alembic>=1.14,<2",
    "pyjwt>=2.8,<3",
    "pwdlib[argon2]>=0.2,<1",
    "email-validator>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "aiosqlite>=0.20,<1"]

[tool.setuptools.packages.find]
include = ["app*"]
