# LiveKit 시그널링 프록시 설정 (nginx)
#
# - API용 flipside.conf와 별개의 서브도메인 server 블록이다. API 설정은 건드리지 않는다.
# - TLS를 여기서 종료하고 LiveKit 컨테이너(127.0.0.1:7880)로 넘긴다.
# - 미디어(7881/TCP, 7882/UDP)는 nginx를 거치지 않는다.
# - 이 파일을 넣기 전에 DNS A 레코드를 등록하고 인증서를 먼저 발급해야 한다(README 참고).
#
# 설치 위치: /etc/nginx/sites-available/livekit.conf (sites-enabled에 링크)
# 반영: sudo nginx -t && sudo systemctl reload nginx

# http -> https 리다이렉트
server {
    listen 80;
    server_name livekit.flipside.o-r.kr;

    # certbot 갱신 경로(/.well-known/acme-challenge/)가 리다이렉트보다 먼저 처리되도록 location 안에 둔다.
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name livekit.flipside.o-r.kr;

    ssl_certificate     /etc/letsencrypt/live/livekit.flipside.o-r.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.flipside.o-r.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;

        # 이 도메인으로 오는 요청은 거의 모두 웹소켓 시그널링이다.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 통화 중에는 시그널링 연결이 계속 열려 있다. 짧으면 조용한 연결을 nginx가 끊는다.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
