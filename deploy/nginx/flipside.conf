# Flipside API 프록시 설정 (nginx)
#
# - 서버에 이미 떠 있는 nginx에 이 도메인만 추가한다. 다른 서비스의 설정은 건드리지 않는다.
# - TLS를 여기서 종료하고 backend 컨테이너(127.0.0.1:8000)로 넘긴다.
# - 인증서는 certbot이 Let's Encrypt에서 발급하고 자동으로 갱신한다.
#   이 파일을 넣기 전에 인증서를 먼저 발급해야 한다(README 참고).
#
# 설치 위치: /etc/nginx/sites-available/flipside.conf (sites-enabled에 링크)
# 반영: sudo nginx -t && sudo systemctl reload nginx

# 웹소켓 요청일 때만 Connection 헤더를 upgrade로 넘긴다.
map $http_upgrade $flipside_connection {
    default upgrade;
    ''      close;
}

# http -> https 리다이렉트
server {
    listen 80;
    server_name www.flipside.o-r.kr;

    # server 바로 아래가 아니라 location 안에 둔다.
    # certbot이 갱신할 때 넣는 /.well-known/acme-challenge/ 경로가 리다이렉트보다 먼저 처리된다.
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.flipside.o-r.kr;

    ssl_certificate     /etc/letsencrypt/live/www.flipside.o-r.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.flipside.o-r.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 녹음 업로드 상한(VOICE_RECORDING_MAX_BYTES, 1GB)에 multipart 여유분을 더한 값.
    client_max_body_size 1100m;

    # 업로드를 nginx 디스크에 모았다가 넘기지 않고 backend로 바로 흘려보낸다.
    proxy_request_buffering off;

    # backend가 AI 서비스 응답을 기다리는 요청이 있다(AI_ENROLL_TIMEOUT_SECONDS 120초).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 모든 location이 공통으로 쓰는 헤더.
    # X-Forwarded-For는 클라이언트가 보낸 값을 버리고 nginx가 본 IP로 덮어쓴다.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $flipside_connection;

    # 경로별로 다른 서비스에 넘기려면 location 블록을 추가한다.
    # 웹소켓은 위 Upgrade/Connection 헤더로 이미 통과한다.
    # 연결을 오래 유지하는 경로는 proxy_read_timeout만 따로 늘린다.
    #
    # location /ws/ {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_read_timeout 1h;
    # }
    #
    # LiveKit 시그널링을 같은 도메인의 경로로 붙이는 예:
    #
    # location /rtc {
    #     proxy_pass http://127.0.0.1:7880;
    #     proxy_read_timeout 1h;
    # }

    # 기본: 나머지 모든 요청은 backend로 넘긴다.
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

# 서브도메인으로 추가하려면 위 두 server 블록을 복사해 server_name과 proxy_pass를 바꾸고,
# 그 도메인의 인증서를 certbot으로 먼저 발급한다.
