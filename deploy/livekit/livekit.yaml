# 자체 호스팅 LiveKit 서버 설정 (단일 서버).
# API 키와 시크릿은 여기에 적지 않는다. 서버 compose에서 환경 변수
# LIVEKIT_KEYS="<API 키>: <시크릿>" 으로 넣는다.

# 시그널링(HTTP/WebSocket). TLS는 호스트 nginx가 종료하고 127.0.0.1:7880으로 넘긴다.
# 이 포트는 외부에 직접 열지 않는다. compose에서 127.0.0.1에만 공개한다.
port: 7880

rtc:
  # UDP가 막힌 망에서 쓰는 TCP 우회 경로. 방화벽에서 TCP 7881을 열어야 한다.
  tcp_port: 7881
  # 미디어용 UDP를 한 포트로 묶는다. 방화벽에서 UDP 7882를 열어야 한다.
  udp_port: 7882
  # 컨테이너와 서버는 사설 IP만 갖고 있으므로 STUN으로 공인 IP를 찾아 클라이언트에 알린다.
  use_external_ip: true

room:
  # 마지막 참가자가 나간 뒤 방을 닫기까지의 시간(초)
  empty_timeout: 300

turn:
  enabled: false

logging:
  level: info
